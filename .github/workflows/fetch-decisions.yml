name: 결정례 자동 업데이트

on:
  schedule:
    - cron: '0 15 * * *'   # 매일 KST 00:00 (UTC 15:00)
  workflow_dispatch:         # 수동 실행 버튼

jobs:
  fetch-decisions:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests beautifulsoup4 lxml

      - name: 결정례 수집 실행
        run: python scripts/fetch_decisions.py

      - name: 영상자료 수집 실행
        run: python scripts/fetch_videos.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/decisions.json data/videos.json
          git diff --staged --quiet || git commit -m "chore: 결정례·영상 자동 업데이트 $(date +'%Y-%m-%d')"
          git push
